[project]
name = "weanj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michel Schanen", email = "michel.schanen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "ipykernel>=7.4.0",
    "jax-md>=0.2.29",
    "jax[cuda13]==0.11.2",
    "jinja2>=3.1.6",
    "jupyter-client>=8.10.0",
    "jupyter-core>=5.9.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "optimistix>=0.1.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
